name: worn-tape-memory

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: worn_tape_memory
      POSTGRES_PASSWORD: worn_tape_memory
      POSTGRES_DB: worn_tape_memory
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

volumes:
  postgres-data: